name: Workstation checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test-and-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MARKET_FEED_ENABLED: '0'
      MARKET_DB_PATH: /tmp/market-ci.db
      SKILLS_DB_PATH: /tmp/skills-ci.db
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements.txt
      - run: npm ci --prefix frontend
      - run: python -m unittest discover -s backend/tests -v
      - run: node --test frontend/src/indicators.test.js
      - run: npm --prefix frontend run build
      - name: Start local services and runner-provided ChromeDriver
        run: |
          python -m uvicorn app.main:app --app-dir backend --host 127.0.0.1 --port 8000 > /tmp/market-api.log 2>&1 &
          npm --prefix frontend run dev -- --host 127.0.0.1 > /tmp/market-vite.log 2>&1 &
          "$CHROMEWEBDRIVER/chromedriver" --port=9515 > /tmp/market-driver.log 2>&1 &
          python - <<'PY'
          import time, urllib.request
          for _ in range(60):
              try:
                  urllib.request.urlopen('http://127.0.0.1:5173/', timeout=2)
                  urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)
                  break
              except OSError:
                  time.sleep(1)
          else:
              raise RuntimeError('Local services did not start')
          PY
      - run: python scripts/browser_smoke.py
      - name: Upload browser evidence and service diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workstation-browser-evidence
          path: |
            /tmp/strategy-browser.png
            /tmp/market-api.log
            /tmp/market-vite.log
            /tmp/market-driver.log
