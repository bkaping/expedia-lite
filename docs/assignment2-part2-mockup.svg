<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc">
  <title id="title">Wayfarer Lite Part 2 early shortlist mockup</title>
  <desc id="desc">A wireframe showing live hotel results with save buttons and a persistent shortlist with remove buttons.</desc>
  <style>
    .bg{fill:#f6f8fc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.text{font-family:Arial,sans-serif;fill:#172236}.muted{font-family:Arial,sans-serif;fill:#64748b}.heading{font-family:Arial,sans-serif;fill:#172236;font-weight:bold}.label{font-family:Arial,sans-serif;fill:#365ca7;font-weight:bold;font-size:15px;letter-spacing:1px}.save{fill:#2256d7}.remove{fill:#fff;stroke:#b92945;stroke-width:2}.card{fill:#fbfcfe;stroke:#cbd5e1;stroke-width:2}
  </style>
  <rect class="bg" width="1200" height="790"/>
  <text class="label" x="76" y="68">EARLY MOCKUP · ASSIGNMENT 2 PART 2</text>
  <text class="heading" x="76" y="113" font-size="40">Wayfarer Lite shortlist</text>
  <text class="muted" x="76" y="143" font-size="19">Save recognizable provider-place snapshots and return to them after a restart.</text>
  <rect class="panel" x="76" y="180" width="1048" height="264" rx="15"/>
  <text class="label" x="104" y="218">LIVE RESULT</text>
  <rect class="card" x="104" y="238" width="660" height="79" rx="9"/>
  <text class="heading" x="126" y="270" font-size="19">Beacon Hill Hotel and Bistro</text>
  <text class="muted" x="126" y="298" font-size="15">Provider address · Provider coordinates</text>
  <rect class="save" x="782" y="257" width="194" height="42" rx="8"/>
  <text x="813" y="284" font-family="Arial,sans-serif" fill="#fff" font-weight="bold" font-size="16">Save to shortlist</text>
  <text class="muted" x="104" y="360" font-size="16">Save captures the provider ID, name, address, and coordinates — not price or booking data.</text>
  <rect class="panel" x="76" y="470" width="1048" height="254" rx="15"/>
  <text class="label" x="104" y="510">PERSISTENT SQLITE SHORTLIST</text>
  <text class="heading" x="104" y="548" font-size="25">Saved shortlist</text>
  <text class="muted" x="104" y="575" font-size="16">Stored provider snapshot · remains after browser and backend restarts</text>
  <rect class="card" x="104" y="596" width="836" height="86" rx="9"/>
  <text class="heading" x="126" y="629" font-size="18">Beacon Hill Hotel and Bistro</text>
  <text class="muted" x="126" y="656" font-size="15">25–29 Charles Street · saved Sep 29</text>
  <rect class="remove" x="958" y="617" width="130" height="42" rx="8"/>
  <text x="987" y="644" font-family="Arial,sans-serif" fill="#a42934" font-weight="bold" font-size="15">Remove</text>
  <text class="muted" x="104" y="758" font-size="14">Repeated saves are prevented by the provider place ID; removing affects only the selected saved record.</text>
</svg>
