<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1050" viewBox="0 0 1440 1050" role="img" aria-labelledby="title desc">
  <title id="title">Stillpoint Part 3.1 interface concept</title>
  <desc id="desc">Three interface mockups show choosing a practice, the paced-breathing screen, and history. Each contains a Crisis support control.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ecf5f2"/><stop offset="1" stop-color="#e4ecef"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#18363d" flood-opacity=".14"/></filter>
    <style>
      .title{font:700 34px Arial,sans-serif;fill:#18363d}.sub{font:400 18px Arial,sans-serif;fill:#4c6568}.screenTitle{font:700 20px Arial,sans-serif;fill:#18363d}.body{font:400 16px Arial,sans-serif;fill:#40595d}.small{font:400 13px Arial,sans-serif;fill:#577074}.button{font:700 15px Arial,sans-serif;fill:#fff}.buttonDark{font:700 15px Arial,sans-serif;fill:#17383f}.cardTitle{font:700 18px Arial,sans-serif;fill:#18363d}.num{font:700 60px Arial,sans-serif;fill:#18363d}.caption{font:700 16px Arial,sans-serif;fill:#35575d}.label{font:700 12px Arial,sans-serif;fill:#fff;letter-spacing:.8px}
    </style>
  </defs>
  <rect width="1440" height="1050" fill="url(#bg)"/>
  <text x="92" y="86" class="title">Stillpoint · Assignment 3.1 interface concept</text>
  <text x="92" y="120" class="sub">Low-demand practice flow · fictional coursework prototype · 3 key states</text>
  <g transform="translate(92 176)" filter="url(#shadow)">
    <rect width="364" height="650" rx="26" fill="#fff"/>
    <rect width="364" height="76" rx="26" fill="#f7faf9"/>
    <path d="M0 50a26 26 0 0 1 26-26h312a26 26 0 0 1 26 26v26H0z" fill="#f7faf9"/>
    <circle cx="37" cy="38" r="13" fill="#8cc8bc"/><text x="62" y="45" class="screenTitle">Stillpoint</text>
    <text x="36" y="137" class="screenTitle">Choose a small practice</text>
    <text x="36" y="166" class="body">You can stop or leave at any time.</text>
    <rect x="28" y="206" width="308" height="142" rx="18" fill="#edf7f4" stroke="#bdded6"/>
    <circle cx="61" cy="244" r="18" fill="#8cc8bc"/><text x="91" y="240" class="cardTitle">Paced breathing</text>
    <text x="91" y="266" class="body">4 seconds in · 6 seconds out</text>
    <text x="91" y="293" class="small">About 60 seconds</text>
    <text x="292" y="286" class="caption">→</text>
    <rect x="28" y="368" width="308" height="142" rx="18" fill="#fffaf2" stroke="#ead9bc"/>
    <circle cx="61" cy="406" r="18" fill="#e8bd78"/><text x="91" y="402" class="cardTitle">5–4–3–2–1 grounding</text>
    <text x="91" y="428" class="body">Notice what is around you</text>
    <text x="91" y="455" class="small">About 45–75 seconds · no typing required</text>
    <text x="292" y="448" class="caption">→</text>
    <rect x="28" y="542" width="308" height="1" fill="#dde9e7"/>
    <text x="36" y="580" class="body">Recent practice</text><text x="272" y="580" class="caption">View ›</text>
    <rect x="28" y="603" width="308" height="1" fill="#dde9e7"/>
    <rect x="28" y="616" width="308" height="48" rx="24" fill="#eff4f5"/>
    <circle cx="53" cy="640" r="10" fill="#315d67"/><text x="74" y="645" class="buttonDark">Crisis support</text>
  </g>
  <g transform="translate(538 176)" filter="url(#shadow)">
    <rect width="364" height="650" rx="26" fill="#fff"/>
    <rect width="364" height="76" rx="26" fill="#f7faf9"/>
    <path d="M0 50a26 26 0 0 1 26-26h312a26 26 0 0 1 26 26v26H0z" fill="#f7faf9"/>
    <text x="31" y="45" class="screenTitle">Paced breathing</text><text x="286" y="45" class="small">Leave</text>
    <text x="182" y="131" text-anchor="middle" class="small">Cycle 2 of 6</text>
    <circle cx="182" cy="311" r="130" fill="#edf7f4" stroke="#a7d5ca" stroke-width="2"/>
    <circle cx="182" cy="311" r="92" fill="#d5eee8"/>
    <text x="182" y="288" text-anchor="middle" class="screenTitle">Breathe in</text>
    <text x="182" y="356" text-anchor="middle" class="num">4</text>
    <text x="182" y="412" text-anchor="middle" class="body">Slowly fill your lungs</text>
    <rect x="32" y="490" width="300" height="12" rx="6" fill="#e4efed"/><rect x="32" y="490" width="100" height="12" rx="6" fill="#77b9ab"/>
    <text x="182" y="534" text-anchor="middle" class="small">Active practice time · 00:14</text>
    <rect x="32" y="566" width="144" height="52" rx="26" fill="#315d67"/><text x="104" y="598" text-anchor="middle" class="button">Pause</text>
    <rect x="188" y="566" width="144" height="52" rx="26" fill="#eff4f5"/><text x="260" y="598" text-anchor="middle" class="buttonDark">End practice</text>
    <rect x="28" y="616" width="308" height="48" rx="24" fill="#eff4f5"/>
    <circle cx="53" cy="640" r="10" fill="#315d67"/><text x="74" y="645" class="buttonDark">Crisis support</text>
  </g>
  <g transform="translate(984 176)" filter="url(#shadow)">
    <rect width="364" height="650" rx="26" fill="#fff"/>
    <rect width="364" height="76" rx="26" fill="#f7faf9"/>
    <path d="M0 50a26 26 0 0 1 26-26h312a26 26 0 0 1 26 26v26H0z" fill="#f7faf9"/>
    <text x="31" y="45" class="screenTitle">Recent practice</text><text x="294" y="45" class="small">Home</text>
    <text x="32" y="127" class="body">A small record for your review.</text>
    <rect x="28" y="161" width="308" height="122" rx="18" fill="#edf7f4"/>
    <text x="50" y="200" class="cardTitle">Paced breathing</text><text x="50" y="229" class="body">Completed · 60 active seconds</text><text x="50" y="256" class="small">Today · chosen by you</text>
    <rect x="28" y="302" width="308" height="122" rx="18" fill="#f6f8f8"/>
    <text x="50" y="341" class="cardTitle">5–4–3–2–1 grounding</text><text x="50" y="370" class="body">Stopped · 18 active seconds</text><text x="50" y="397" class="small">Yesterday · no explanation needed</text>
    <rect x="28" y="462" width="308" height="78" rx="18" fill="#fffaf2" stroke="#ead9bc"/>
    <text x="50" y="492" class="cardTitle">Use this practice again?</text><text x="50" y="519" class="small">Optional shortcut; both choices stay available.</text>
    <rect x="32" y="566" width="300" height="52" rx="26" fill="#315d67"/><text x="182" y="598" text-anchor="middle" class="button">Choose a practice</text>
    <rect x="28" y="616" width="308" height="48" rx="24" fill="#eff4f5"/>
    <circle cx="53" cy="640" r="10" fill="#315d67"/><text x="74" y="645" class="buttonDark">Crisis support</text>
  </g>
  <g>
    <line x1="274" y1="862" x2="274" y2="900" stroke="#94aaa9" stroke-width="2"/><circle cx="274" cy="900" r="4" fill="#315d67"/>
    <line x1="720" y1="862" x2="720" y2="900" stroke="#94aaa9" stroke-width="2"/><circle cx="720" cy="900" r="4" fill="#315d67"/>
    <line x1="1166" y1="862" x2="1166" y2="900" stroke="#94aaa9" stroke-width="2"/><circle cx="1166" cy="900" r="4" fill="#315d67"/>
    <text x="274" y="939" text-anchor="middle" class="caption">1 · Choose, without disclosing</text>
    <text x="720" y="939" text-anchor="middle" class="caption">2 · Follow one canonical skill</text>
    <text x="1166" y="939" text-anchor="middle" class="caption">3 · Review, without a score</text>
    <text x="720" y="993" text-anchor="middle" class="small">The persistent support route and a visible leave action preserve access and control across the flow.</text>
  </g>
</svg>
